[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbailey03/Porpoise_PDF"
publish = false

[workspace.dependencies]
# --- Internal ---
porpoise-doc = { path = "crates/porpoise-doc" }
porpoise-render = { path = "crates/porpoise-render" }
porpoise-view = { path = "crates/porpoise-view" }

# --- PDF: parsing and rendering (see docs/goal-1-plan.md, section 1) ---
hayro = "0.7.1"
hayro-syntax = "0.7.2"
# Document model for incremental save. Not used until the editor phase; declared
# here so the version decision lives in one place.
lopdf = "0.44"

# --- Shell ---
egui = "0.35"
eframe = "0.35"

# --- Support ---
thiserror = "2.0"
tracing = "0.1"
# Without a subscriber installed, every `tracing` call compiles to a no-op and the
# diagnostics vanish — including "the renderer just panicked", which is the last
# one we can afford to lose. `env-filter` is deliberately *not* enabled: it pulls
# in regex machinery to parse a filter string, which is a poor trade for a project
# whose argument rests on a small, auditable dependency graph.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
] }
clap = { version = "4.6", features = ["derive"] }
# Used directly rather than through `image`, which would require cloning the
# whole page buffer to hand it an owned Vec. Already in the tree via hayro.
png = "0.18"

# Applied to every member via `[lints] workspace = true`.
[workspace.lints.rust]
# The security case for this project rests on memory safety, so state it as a
# machine-checked invariant rather than an intention.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Panicking on untrusted input is a denial-of-service bug in this codebase, not a
# style question. See docs/goal-1-plan.md, section 2.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

[profile.release]
# PDF rasterization is compute-bound; cross-crate inlining is worth the build time.
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
# Debug builds of a debug-built rasterizer are unusably slow. Optimize
# dependencies while leaving our own crates debuggable.
opt-level = 2
